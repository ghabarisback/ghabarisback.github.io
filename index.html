<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ghabar Is Back — Pakistan, be ready. A new video is coming soon." />
    <meta name="theme-color" content="#090a08" />
    <title>Ghabar Is Back</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" id="hero">
      <img
        class="hero__image"
        id="hero-image"
        src="images/1.jpg"
        alt="Ghabar Is Back preview"
        fetchpriority="high"
      />
      <div class="hero__fallback" aria-hidden="true"></div>
      <div class="hero__grain" aria-hidden="true"></div>
      <div class="hero__shade" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="#hero" aria-label="Ghabar Is Back, home">
          <span class="brand__mark" aria-hidden="true">G</span>
          <span>Ghabar Is Back</span>
        </a>
        <div class="status"><span class="status__dot"></span> Transmission pending</div>
      </header>

      <section class="hero__content" aria-labelledby="hero-title">
        <p class="eyebrow"><span></span> Incoming from Pakistan</p>
        <h1 id="hero-title">Be ready,<br /><em>Pakistan.</em></h1>
        <p class="intro">Here comes a video soon.</p>

        <div class="countdown" aria-label="The countdown has begun">
          <span>Tic</span>
          <i aria-hidden="true"></i>
          <span>Toc</span>
          <i aria-hidden="true"></i>
          <span>Tic</span>
          <i aria-hidden="true"></i>
          <span>Toc</span>
        </div>
      </section>

      <footer class="site-footer">
        <p>Something is moving in the shadows.</p>
        <p class="frame-counter" id="frame-counter" hidden>Frame <span>01</span></p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
